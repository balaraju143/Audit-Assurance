<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 | Stackly Audit & Assurance</title>


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/404.css"
    >

</head>


<body class="audit-404-body">


    <!-- =====================================================
         404 PAGE
    ====================================================== -->

    <main class="audit-404-page">


        <!-- Background decorative elements -->

        <div class="audit-404-glow audit-404-glow-one"></div>

        <div class="audit-404-glow audit-404-glow-two"></div>


        <!-- =================================================
             404 CARD
        ================================================== -->

        <section class="audit-404-card">


            <!-- Logo -->

            <a
                href="index.html"
                class="audit-404-logo"
            >

                <img
                    src="assetss/logo 4.webp"
                    alt="Stackly"
                >

            </a>


            <!-- 404 Visual -->

            <div class="audit-404-visual">

                <div class="audit-404-number">
                    404
                </div>


                <div class="audit-404-icon">

                    <i class="fa-solid fa-shield-halved"></i>

                </div>

            </div>


            <!-- Content -->

            <div class="audit-404-content">

                <span class="audit-404-label">
                    AUDIT & ASSURANCE
                </span>


                <h1>
                    Page Not Found
                </h1>


                <p>
                    The assurance page you are looking for may have
                    been moved, removed, or is temporarily unavailable.
                    Let's get you back to the Stackly Audit & Assurance
                    experience.
                </p>

            </div>


            <!-- Buttons -->

            <div class="audit-404-buttons">

                <a
                    href="index.html"
                    class="audit-404-button audit-404-primary"
                >
                    Back to Home
                </a>


                <button
                    type="button"
                    class="audit-404-button audit-404-secondary"
                    id="audit404BackButton"
                >
                    Previous Page
                </button>

            </div>


        </section>

    </main>


    <!-- GSAP -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>


    <!-- 404 JS -->

    <script src="js/404.js"></script>

</body>

</html>
